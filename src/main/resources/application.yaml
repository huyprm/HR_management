server:
  port: 8080
spring:
  application:
    name: HR_management
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hr_management
    username: root
    password: 12345
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  docker:
    compose:
      enabled: false
  web:
    resources:
      static-locations: E:\\Java\\HR_management\\images
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

